name: Deploy web app to GitHub Pages

# The site is static: index.html + app/*.js + the db_*/ JSON tables, served from
# the repo root exactly as they sit on disk (.nojekyll keeps Pages from touching
# app/ and db_*/). So "build" is just packaging the checkout.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a push mid-deploy
# still ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Built here rather than committed, so the docs can never drift from the code
      # they describe. graphviz is for the call graphs the Doxyfile asks for.
      - name: Build the API documentation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen graphviz
          doxygen Doxyfile
          test -f documentation/index.html

      - name: Package the repo root
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # After packaging on purpose: py_compile drops a __pycache__ that would
      # otherwise ride along into the artifact.
      - name: Syntax-check the Python CLI
        run: python3 -m py_compile sl2_to_md.py

      # Formatting is checked, never applied, on a deploy: a workflow that rewrites the
      # tree it is publishing is a workflow nobody can reason about. `ruff format
      # --check` and `prettier --check` both exit non-zero on a difference, so an
      # unformatted push fails here rather than landing.
      - name: Check formatting and lint
        run: |
          pipx run ruff format --check .
          pipx run ruff check .
          npx --yes prettier@3 --check "**/*.{js,html,json,yml}"

      - id: deployment
        uses: actions/deploy-pages@v4
