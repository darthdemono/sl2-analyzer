<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
  <!-- The grain the Dark Souls menus sit on. One patch of fractal noise, drained of
       colour and left transparent, so CSS can lay it over whatever plate colour a
       panel uses. Same trick the FromSoft Image Macro Creator uses on its own boxes
       (rezuaq.be/new-area). Kept as a file rather than a data URI so one request
       serves every panel on the page. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="300" height="300" filter="url(#grain)" opacity=".07" />
</svg>
